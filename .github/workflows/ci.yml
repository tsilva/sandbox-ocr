name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev --no-config
      - run: uv audit --frozen --no-config
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q tests
      - run: uv run --no-sync python -c "import olmocr.pipeline, olmocr_extractor, ocr_providers"
