[project]
name = "olmocr-test"
version = "0.1.0"
description = "Testing OLMoCR with DeepInfra remote inference"
requires-python = ">=3.11.5"
dependencies = [
    "olmocr>=0.4.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
exclude-newer = "7 days"
# Approved on 2026-10-28: cached-path declares <4, but its classic FileLock API
# is validated by offline locking/extraction regressions with this exact patch.
override-dependencies = ["filelock==4.2.4"]
constraint-dependencies = [
  "certifi>=2026.10.19",
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "bleach>=6.4.0",
  "cryptography>=50",
  "idna>=3.20",
  "pillow>=13.0.0",
  "pyasn1>=0.6.5",
  "pygments>=2.21.0",
  "pypdf>=6.21.4",
  "requests>=2.33",
  "setuptools>=83",
  "soupsieve>=4.0",
  "torch>=2.15.0",
  "transformers>=5.22.1",
  "urllib3>=2.8.0",
]
package = false

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16.2,<0.17",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
